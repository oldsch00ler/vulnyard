# Build path for platforms using nixpacks (Coolify, Railway, ...).
# The Docker path lives in Dockerfile / docker-compose.yml; keep both in sync.
# "..." keeps the packages/commands detected by nixpacks and appends ours.

[phases.setup]
nixPkgs = ["...", "nodejs_22", "git", "curl"]

[phases.build]
cmds = [
  "bash scripts/install-trivy.sh ./.bin",
  "cd frontend && npm ci && npm run build",
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
